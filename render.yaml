services:
  - type: web
    name: tbd-supply
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: SEED_DEMO_CATALOG
        value: "true"
      - key: SESSION_PEPPER
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
    disk:
      name: tbd-data
      mountPath: /app/server/data
      sizeGB: 1
